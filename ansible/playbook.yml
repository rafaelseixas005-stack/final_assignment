---
- name: Install and Configure Nginx
  hosts: webservers
  become: true
  vars_files:
    - vault.yml

  tasks:
    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install Nginx
      apt:
        name: nginx
        state: present

    - name: Ensure Nginx is running and enabled
      service:
        name: nginx
        state: started
        enabled: true

    - name: Create a custom index.html
      copy:
        dest: /var/www/html/index.html
        mode: '0644'
        content: |
          <!DOCTYPE html>
          <html>
          <head>
              <title>Welcome to Nginx on Azure!</title>
              <style>
                  body { font-family: sans-serif; text-align: center; padding: 50px; }
                  h1 { color: #0078d4; }
              </style>
          </head>
          <body>
              <h1>Success! Nginx is running on your Azure VM.</h1>
              <p>Provisioned with Terraform and configured with Ansible.</p>
          </body>
          </html>


- name: Install and Configure DHCP Server
  hosts: dhcp
  become: true

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install DHCP server
      apt:
        name: isc-dhcp-server
        state: present

    - name: Configure DHCP interface
      copy:
        dest: /etc/default/isc-dhcp-server
        content: |
          INTERFACESv4="eth0"

    - name: Configure dhcpd.conf
      copy:
        dest: /etc/dhcp/dhcpd.conf
        content: |
          subnet 10.0.1.0 netmask 255.255.255.0 {
            range 10.0.1.100 10.0.1.150;
            option routers 10.0.1.1;
            option domain-name-servers 8.8.8.8;
          }

    - name: Restart and enable DHCP service
      service:
        name: isc-dhcp-server
        state: restarted
        enabled: yes
